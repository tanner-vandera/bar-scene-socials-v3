<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Featured Bars — Milwaukee, picked by us</title>
<meta name="description" content="Milwaukee bars worth your night, chosen by the people who run the crawls.">
<script>/* Hide the reveal groups BEFORE first paint — see README, "The reveal flash".
   Guarded twice: reduced motion never hides anything, and if bss.js has not
   booted within 2.5s the class is pulled back off so a failed script can
   never leave a page blank. */
(function(d,w){var r=d.documentElement;
if(w.matchMedia&&w.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
r.className+=(r.className?' ':'')+'has-js';
w.setTimeout(function(){if(!w.__bssBooted)r.className=r.className.replace(/\s*\bhas-js\b/,'');},2500);
})(document,window);</script>
<link rel="stylesheet" href="css/fonts.css?v=1788876527">
<link rel="stylesheet" href="css/bss.css?v=1788876527">
</head>
<body data-page="bars">
<div id="chrome-header"></div>
<main>
  <!-- The page head used to sit in its own .band--tight above a second
       .band, with the category tabs and neighbourhood chips filling the
       space between them. With the filters gone that was two lots of band
       padding around nothing, so the head moved into the grid's own
       section — same pattern as Happening Now. -->
  <section class="band band--tight">
    <div class="shell">
      <div class="pagehead pagehead--slim">
        <h1 class="d3 fx">Featured <em class="scr">bars</em></h1>
      </div>
      <!-- Photo and name only. The neighbourhood line, the write-up and the
           route chip all came off — there is nothing written up yet, and a
           card carrying three lines of invented copy under a real photograph
           is worse than one carrying none. They go back in per bar as the
           owners write them. -->
      <div class="cols c-3" data-reveal>
        <a class="card" href="#">
          <div class="photo ar-43"><img src="images/bar-water-street-brewery.jpg"
            alt="Inside Water Street Brewery — brick arches, neon beer signs, a pool table and a long bar of pink stools" loading="lazy" decoding="async"></div>
          <div class="card__body"><h3 class="h4">Water Street Brewery</h3></div>
        </a>
        <a class="card" href="#">
          <div class="photo ar-43"><img src="images/bar-jacks-american-pub.jpg"
            alt="The long dark bar at Jacks American Pub, green walls covered in framed photos" loading="lazy" decoding="async"></div>
          <div class="card__body"><h3 class="h4">Jacks American Pub</h3></div>
        </a>
        <a class="card" href="#">
          <div class="photo ar-43"><img src="images/bar-jo-cats.jpg"
            alt="Jo-Cats at night from across the street, neon in the windows and string lights over the patio" loading="lazy" decoding="async"></div>
          <div class="card__body"><h3 class="h4">Jo-Cats</h3></div>
        </a>
        <a class="card" href="#">
          <div class="photo ar-43"><img src="images/bar-deer-camp.jpg"
            alt="Deer Camp — antler chandeliers, a stone fireplace and orange-topped stools" loading="lazy" decoding="async"></div>
          <div class="card__body"><h3 class="h4">Deer Camp</h3></div>
        </a>
        <a class="card" href="#">
          <div class="photo ar-43"><img src="images/bar-burnhearts.jpg"
            alt="Burnhearts from the pavement, the script sign across the front and wicker chairs lined up under it" loading="lazy" decoding="async"></div>
          <div class="card__body"><h3 class="h4">Burnhearts</h3></div>
        </a>
        <a class="card" href="#">
          <div class="photo ar-43"><img src="images/bar-finks.jpg"
            alt="The pergola over the patio at Finks, strung with festoon lights" loading="lazy" decoding="async"></div>
          <div class="card__body"><h3 class="h4">Finks</h3></div>
        </a>
        <a class="card" href="#">
          <div class="photo ar-43"><img src="images/bar-the-sofie.jpg"
            alt="The Sofie — leather chesterfields down both walls, a long gas fire at the far end" loading="lazy" decoding="async"></div>
          <div class="card__body"><h3 class="h4">The Sofie</h3></div>
        </a>
      </div>
    </div>
  </section>
  <span class="tear tear--down" style="--tear-fill:#F8F8F6"></span>
  <section class="band on-white">
    <div class="shell">
      <div class="cols c-wide-left" data-reveal style="align-items:center">
        <div class="stack">
          <h2 class="d2 fx" style="max-width:13ch">Want on<br>a <em class="scr">route</em>?</h2>
          <p class="lede" style="max-width:40ch">Ten bars have to say yes before a crawl exists. If yours should be one of them, tell us — it is a short email, not a pitch deck.</p>
        </div>
        <div class="row row--end"><a class="btn" href="contact.html">Get in touch</a></div>
      </div>
    </div>
  </section>
  <span class="tear tear--up" style="--tear-fill:#F8F8F6"></span>
</main>
<div id="chrome-footer"></div>
<script src="js/bss.js?v=1788876527"></script>
</body>
</html>
