<!doctype html>
<html lang="en" data-gate-page>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bar Scene Socials — coming soon</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Bar Scene Socials. Milwaukee. Launching shortly.">
<link rel="stylesheet" href="css/fonts.css?v=1788613246">
<link rel="stylesheet" href="css/bss.css?v=1788613246">
<style>
  /* the gate has no header or footer, so it owns its own layout */
  body{padding-top:0}
  .gate{
    position:relative; isolation:isolate; overflow:hidden;
    min-height:100vh; min-height:100svh;
    display:grid; place-items:center; text-align:center;
  }
  .gate__media{
    position:absolute; inset:0; z-index:0;
    background:linear-gradient(152deg,var(--orange) 0%,var(--red) 44%,var(--ink-deep) 100%);
  }
  .gate__media::before{
    content:""; position:absolute; inset:0;
    background-image:radial-gradient(rgba(17,17,16,.34) 1.4px, transparent 1.5px);
    background-size:7px 7px; mix-blend-mode:multiply;
  }
  .gate__scrim{
    position:absolute; inset:0; z-index:1;
    background:linear-gradient(180deg,rgba(10,10,9,.58) 0%,rgba(10,10,9,.36) 42%,rgba(10,10,9,.74) 100%);
  }
  .gate__inner{
    position:relative; z-index:2; width:100%; max-width:640px;
    padding:clamp(48px,8vh,96px) 24px; display:grid; justify-items:center;
    gap:clamp(18px,2.6vh,28px); color:var(--ink);
  }
  .gate__mark svg{width:56px; height:56px; overflow:visible}
  .gate__form{width:100%; max-width:400px; display:grid; gap:12px; margin-top:6px}
  .gate__row{display:flex; gap:10px; flex-wrap:wrap}
  .gate__row .field{flex:1; min-width:190px}
  .gate .field{
    background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.34); color:var(--ink);
  }
  .gate .field::placeholder{color:rgba(255,255,255,.6)}
  .gate .field:focus{border-color:var(--ink); box-shadow:0 0 0 4px rgba(255,255,255,.24)}
  .gate__msg{
    min-height:1.3em; font:500 12.5px/1.3 var(--body);
    color:#FFD9CC; margin:0;
  }
  .gate__msg[data-ok]{color:#BFF3D2}
  .gate__note{
    font:500 10.5px/1.5 var(--body); text-transform:uppercase; letter-spacing:.18em;
    color:rgba(255,255,255,.6); margin:0;
  }
  .gate__hr{width:52px; height:2px; background:rgba(255,255,255,.34); border:0; margin:6px 0}
</style>
</head>
<body>
<main class="gate grain grain--dark">
  <div class="gate__media"></div>
  <div class="gate__scrim"></div>
  <div class="gate__inner">
    <span class="gate__mark" id="mark"></span>

    <h1 class="d2 fx">Coming<br><em class="scr">soon</em></h1>
    <p class="hero__sub" style="max-width:38ch">
      Three days a year, a few thousand of us take over a street. The first one is
      the Haunted Bar Hop &#8212; 10/31/26, Brady Street.</p>
    <hr class="gate__hr">
    <form class="gate__form" id="gate-form" autocomplete="off">
      <p class="gate__note">Team access</p>
      <div class="gate__row">
        <input class="field" type="password" id="gate-pw" name="preview"
               placeholder="Password" aria-label="Team password" autocomplete="off">
        <button class="btn btn--orange" type="submit">Enter</button>
      </div>
      <p class="gate__msg" id="gate-msg" role="status" aria-live="polite"></p>
    </form>
  </div>
</main>
<script src="js/gate.js?v=1788613246"></script>
<script>
(function () {
  // the brand mark, drawn the same way the site header draws it
  document.getElementById('mark').innerHTML =
    '<svg viewBox="0 0 48 48" width="56" height="56" aria-label="Bar Scene Socials">' +
    '<g fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M4 16.5 L12.3 9.2 L20 16.8 L28.4 9 L36 16.4 L44 9.4"/>' +
    '<path d="M4.3 26.8 L12 19.4 L20.4 27 L28 19.2 L36.3 26.6 L44 19.2"/>' +
    '<path d="M4 37 L12.4 29.6 L20 37.2 L28.2 29.4 L36 36.8 L43.8 29.6"/>' +
    '</g></svg>';

  var form = document.getElementById('gate-form');
  var pw   = document.getElementById('gate-pw');
  var msg  = document.getElementById('gate-msg');

  // already let in this session? skip straight through
  if (window.BSSGate && window.BSSGate.unlocked()) location.replace('index.html');

  async function sha256(text) {
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [].map.call(new Uint8Array(buf), function (b) {
      return b.toString(16).padStart(2, '0');
    }).join('');
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    msg.removeAttribute('data-ok');
    var value = pw.value.trim();
    if (!value) { msg.textContent = 'Enter the password.'; return; }

    // crypto.subtle needs a secure context — https or localhost
    if (!window.crypto || !crypto.subtle) {
      msg.textContent = 'This browser cannot check the password here. Open the site over https.';
      return;
    }

    try {
      var digest = await sha256(value);
      if (digest === window.BSSGate.hash) {
        window.BSSGate.unlock();
        msg.setAttribute('data-ok', '');
        msg.textContent = 'Welcome in.';
        location.replace('index.html');
      } else {
        msg.textContent = 'Not that one. Try again.';
        pw.select();
      }
    } catch (err) {
      msg.textContent = 'Something went wrong checking that.';
    }
  });
})();
</script>
</body>
</html>
